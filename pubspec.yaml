name: ippo_voice_demo
description: Ippo, the voice loan assistant, on Flutter. Live call with real PAN, credit and statement offer, using the ippo_agents and ippo_loanpilot SDKs.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ippo_agents: ^0.3.2
  ippo_loanpilot: ^0.3.0
  http: ^1.2.0
  permission_handler: ^13.0.2
  file_picker: ^13.3.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
